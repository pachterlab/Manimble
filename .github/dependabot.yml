# Security updates only: Dependabot opens a pull request when a pinned dependency has a known vulnerability, and
# no routine version bumps (open-pull-requests-limit: 0 turns those off but leaves security updates on, which need
# "Dependabot security updates" enabled in the repository's Settings > Code security). Covers the GitHub Actions in
# .github/workflows (pinned by commit, with the version in a comment) and the Python packages the app's runtime is
# built from (engine/requirements.txt).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
