# Builds the macOS and Windows apps on every push and PR, so a change can't quietly break either build.
name: build
on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: apps/macos/build_app.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: powershell -ExecutionPolicy Bypass -File apps\windows\build_release.ps1 -Out out
      - uses: actions/upload-artifact@v4
        with:
          name: Manimble-Windows
          path: out/Manimble-Windows.zip
          if-no-files-found: error
