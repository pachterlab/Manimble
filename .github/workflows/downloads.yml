# Counts the app's downloads (the .dmg and .zip of every release, not the Python runtimes the installer fetches) and
# writes them to .github/badges/downloads.json, which the README's Downloads badge reads through shields.io.
name: downloads
on:
  schedule:
    - cron: "17 6 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/releases" --paginate \
                -q '.[].assets[] | select(.name | endswith(".dmg") or endswith(".zip")) | .download_count' \
              | awk '{s += $1} END {print s + 0}')
          echo "downloads: $n"
          printf '{"schemaVersion": 1, "label": "Downloads", "message": "%s", "color": "blue"}\n' "$n" \
            > .github/badges/downloads.json
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update download count"
          git push
