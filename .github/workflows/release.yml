# Builds Manimble.app and publishes it as a GitHub Release.
#
#   Release:  bump VERSION, commit, then  git tag v0.1.0 && git push origin v0.1.0
#   Dry run:  Actions -> release -> Run workflow (builds the app as a workflow artifact only)
#
# The asset keeps the same name in every release, so this link always points at the newest one:
#   https://github.com/pachterlab/Manimble/releases/latest/download/Manimble-macOS.zip
#
# Signing and notarization are optional and turn on when these repository secrets exist (a paid
# Apple Developer ID account): APPLE_CERTIFICATE (base64 .p12 "Developer ID Application" cert),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"),
# APPLE_ID, APPLE_PASSWORD (an app-specific password, not your Apple ID password), APPLE_TEAM_ID.
# Without them the app is ad-hoc signed, same as a local build, and first launch shows a
# Gatekeeper warning (right-click -> Open gets past it; the README explains this).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # `secrets` can't be read in a step's `if:`, so expose whether signing is configured here.
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(cat VERSION)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag is $GITHUB_REF_NAME but VERSION says $v"; exit 1; }

      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')
          rm certificate.p12

      - name: Build and sign
        env:
          MANIMBLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: apps/macos/build_app.sh

      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent apps/macos/Manimble.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple apps/macos/Manimble.app
          rm notarize.zip

      - name: Zip the app
        run: |
          mkdir -p out
          ditto -c -k --keepParent apps/macos/Manimble.app out/Manimble-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Manimble-macOS
          path: out/Manimble-macOS.zip
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/Manimble-macOS.zip --repo "$GITHUB_REPOSITORY" \
            --title "Manimble ${GITHUB_REF_NAME#v}" --generate-notes
