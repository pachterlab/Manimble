# Builds Manimble.app and publishes it as a GitHub Release.
#
#   Release:  bump VERSION, commit, then  git tag v0.1.0 && git push origin v0.1.0
#   Dry run:  Actions -> release -> Run workflow (builds the app as a workflow artifact only)
#
# The assets keep the same names in every release, so these links always point at the newest ones:
#   https://github.com/pachterlab/Manimble/releases/latest/download/Manimble-macOS.dmg
#   https://github.com/pachterlab/Manimble/releases/latest/download/Manimble-macOS.zip
# Each release also carries Manimble-python-arm64.tar.gz and Manimble-python-x86_64.tar.gz, the Python runtimes
# (manim included) that the app's first-launch setup window downloads (apps/macos/install_dependencies.sh).
#
# Signing and notarization are optional and turn on when these repository secrets exist (a paid
# Apple Developer ID account): APPLE_CERTIFICATE (base64 .p12 "Developer ID Application" cert),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"),
# APPLE_ID, APPLE_PASSWORD (an app-specific password, not your Apple ID password), APPLE_TEAM_ID.
# Without them the app is ad-hoc signed, same as a local build, and first launch shows a
# Gatekeeper warning (right-click -> Open gets past it; the README explains this). That is only allowed for a dry
# run: a tag refuses to publish a release that isn't signed and notarized.
#
# The app carries the SHA-256s of the Python runtimes it was released with (runtime-sha256.txt, which
# install_dependencies.sh checks the download against), and each release lists every asset's SHA-256 in SHA256SUMS.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Python runtime is native code, so each architecture is built on its own kind of runner.
  runtime:
    strategy:
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apps/macos/tools/build_python_runtime.sh out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.runner }}
          path: out/Manimble-python-*.tar.gz
          if-no-files-found: error

  release:
    needs: runtime
    runs-on: macos-latest
    permissions:
      contents: write   # to publish the GitHub Release
    # `secrets` can't be read in a step's `if:`, so expose whether signing is configured here.
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(cat VERSION)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag is $GITHUB_REF_NAME but VERSION says $v"; exit 1; }

      - name: Check a tagged release will be signed and notarized
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [ "$HAS_CERT" = true ] && [ "$HAS_NOTARY" = true ] \
            || { echo "::error::a release needs the APPLE_CERTIFICATE and APPLE_ID secrets (see the top of release.yml)"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: out
          merge-multiple: true

      - name: Record the Python runtimes' checksums for the app
        run: |
          for f in out/Manimble-python-*.tar.gz; do
            a="${f#out/Manimble-python-}"; echo "${a%.tar.gz} $(shasum -a 256 "$f" | cut -d' ' -f1)"
          done > runtime-sha256.txt
          cat runtime-sha256.txt
          [ "$(wc -l < runtime-sha256.txt)" -eq 2 ] || { echo "::error::expected two runtimes"; exit 1; }

      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')
          rm certificate.p12

      - name: Build and sign
        env:
          MANIMBLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MANIMBLE_RUNTIME_SHA256S: ${{ github.workspace }}/runtime-sha256.txt
        run: apps/macos/build_app.sh

      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent apps/macos/Manimble.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple apps/macos/Manimble.app
          rm notarize.zip

      - name: Zip the app
        run: |
          mkdir -p out
          ditto -c -k --keepParent apps/macos/Manimble.app out/Manimble-macOS.zip

      - name: Make the disk image
        env:
          MANIMBLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: apps/macos/make_dmg.sh apps/macos/Manimble.app out/Manimble-macOS.dmg

      - name: Notarize the disk image
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit out/Manimble-macOS.dmg --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple out/Manimble-macOS.dmg

      - name: List every asset's SHA-256
        run: cd out && shasum -a 256 Manimble-macOS.dmg Manimble-macOS.zip Manimble-python-*.tar.gz | tee SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Manimble-macOS
          path: |
            out/Manimble-macOS.zip
            out/Manimble-macOS.dmg
            out/Manimble-python-*.tar.gz
            out/SHA256SUMS
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/Manimble-macOS.dmg out/Manimble-macOS.zip out/Manimble-python-*.tar.gz out/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "Manimble ${GITHUB_REF_NAME#v}" --generate-notes
